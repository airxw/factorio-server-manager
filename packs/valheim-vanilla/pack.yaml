# ============================================================================
# Valheim Vanilla Pack — GameServer Panel 4.0.0
# 依据：public/schema/pack-schema.ts（必须通过 zod 校验）
# 协议：stdin（Valheim 原版无 RCON，通过 stdin 控制台发送命令）
# Steam App ID: 896660（Valheim Dedicated Server）
# 参考：https://valheim.com/
#       https://valheim.fandom.com/wiki/Server_hosting
# verified: 2026-07-24 https://valheim.com/
# ============================================================================

pack:
  id: valheim-vanilla
  game: valheim
  variant: vanilla
  display_name: 英灵神殿 (专用服务器)
  version: '1.0'

startup:
  # Linux 专用服务端二进制（Steam App ID: 896660）
  binary: './valheim_server.x86_64'
  # Valheim 通过启动参数配置服务器（无独立配置文件）：
  #   -port        游戏端口（UDP，实际占用 port/port+1/port+2 三个连续端口）
  #   -nographics  无图形界面（专用服务器必选）
  #   -batchmode   批处理模式（专用服务器必选）
  #   -savedir     存档目录
  #   -name        服务器名称（显示在服务器列表）
  #   -world       世界名称（对应存档名）
  #   -password    服务器密码（至少 5 字符）
  #   -public      是否公开到 Steam 列表（1=公开 0=私有）
  #   -crossplay   启用跨平台（Steam/Xbox）
  args:
    - '-port'
    - '{{game_port}}'
    - '-nographics'
    - '-batchmode'
    - '-savedir'
    - '{{instance_root}}/saves'
    - '-name'
    - '{{server_name}}'
    - '-world'
    - '{{world_name}}'
    - '-password'
    - '{{server_password}}'
    - '-public'
    - '1'
    - '-crossplay'
  working_dir: '{{instance_root}}'
  # v4.1.0: Valheim 就绪日志（Game server connected 表示 Steam 后台已注册）
  # 收窄为单一锚点，避免原过宽模式匹配任意含 "game server" 的日志
  ready_pattern: 'Game server connected'
  # Valheim 原版不支持 stdin 停止命令；通过 SIGINT 信号停止进程（优雅保存世界）
  stop_command: null
  stop_method: sigint
  stop_timeout: 30
  # Valheim 默认游戏端口（UDP，实际占用 2456-2458 三个连续端口：游戏/Steam/查询）
  default_game_port: 2456
  # Valheim 端口声明：需 2456-2458 三个连续 UDP 端口
  required_ports:
    - { port: 2456, protocol: udp, name: game,   primary: true }
    - { port: 2457, protocol: udp, name: steam,  primary: false }
    - { port: 2458, protocol: udp, name: query,  primary: false }

protocol:
  # v4.1.0: Valheim 原版无 RCON 支持，仅 stdin 控制台
  type: stdin
  default_port: 0
  auth: none
  encrypt: none

commands:
  # v4.1.0: Valheim 原版 stdin 控制台命令
  broadcast: 'say {{message}}'
  # spawn 命令在玩家附近生成物品（非直接入背包），需玩家在线；物品用 Prefab 名（大小写敏感）
  give_item: 'spawn {{item}} {{count}}'
  kick_player: 'kick {{player}}'
  ban_player: 'ban {{player}}'
  unban_player: 'unban {{player}}'
  list_players: 'info'
  save_world: 'save'

# ---- 版本源 ----
# Valheim 服务端通过 SteamCMD 更新（App ID 896660）。
# provider=official-site 配合 official_url + version_regex 提取人类可读版本号；
# 失败时按 Steam 游戏多源回退链自动降级（official-site → github-release → steamcmd-buildid → static）。
# SteamCMD 实际下载由 daemon steam-install 流程接管（按 depot buildid 下载）。
versions:
  source: 'steamcmd://896660'
  type: steamcmd
  provider: official-site
  official_url: 'https://valheim.com/'
  # 从官网/公告页面提取 x.y.z 格式版本号；未匹配时走回退链（steamcmd-buildid 读取 appmanifest buildid）
  version_regex: '(\d+\.\d+\.\d+)'
  steam_login: anonymous
  eula_required: false

# ---- 游戏更新 ----
# Valheim 走 SteamCMD：current_version_command/install_command 省略（Steam 游戏读 appmanifest buildid，
# 由 daemon steam-install 流程接管下载+安装+校验）。source_url 仅作 URL 格式占位，
# 实际版本获取由 versions.provider 链处理（provider 存在时 updateService 不 fetch source_url）。
update:
  source_url: 'https://valheim.com/'
  download_dir: '{{instance_root}}'

backup:
  # v4.1.0: Valheim 存档目录（通过 -savedir 指定到实例目录的 saves/worlds_local）
  world_dir: '{{instance_root}}/saves/worlds_local'
  # v4.2.0: save 命令已迁移至 backupService GAME_BACKUP_PROTOCOLS（通过 sendCommand 发送）
  pre_backup_commands: []
  post_backup_commands: []

ui:
  tabs:
    - { tab: console,      group: runtime,  order: 10, require_state: [stopped, starting, running, stopping, error] }
    - { tab: config-files, group: config,   order: 10, require_state: [stopped, starting, running, error] }
    - { tab: players,      group: runtime,  order: 40, require_state: [stopped, running, stopping, error] }
    - { tab: saves,        group: ops,      order: 10, require_state: [stopped, error] }
    - { tab: mods,         group: ops,      order: 20, require_state: [stopped, error] }
    - { tab: chat-logs,    group: runtime,  order: 30, require_state: [stopped, running, stopping, error] }
    - { tab: shop-admin,   group: business, order: 10, require_state: [stopped, starting, running, stopping, error] }
    - { tab: update,       group: ops,      order: 30, require_state: [stopped, error] }

resources:
  min_ram: '2G'
  recommended_ram: '4G'
  min_disk: '5G'

