# ---- stdout 事件解析规则 ----
# Valheim 服务端 stdout 日志格式（best-effort，实际格式可能随版本变化）：
#   聊天: [Info   : UI ] Chat: PlayerName: message（简化匹配 [Chat] 前缀）
#   加入: peer 连接后日志含 "Player ... connected"
#   离开: "Player ... disconnected"
# 注：Valheim 原版聊天/进出日志格式不稳定，正则可能需要根据实际输出微调
event_parsers:
  chat:
    pattern: '^\[Chat\] ([^:]+): (.+)$'
    groups: [player, message]
  join:
    pattern: 'Player ([^ ]+) connected'
    player_group: 1
  leave:
    pattern: 'Player ([^ ]+) disconnected'
    player_group: 1

# ---- 业务能力声明 ----
# Valheim spawn 命令模板不含品质参数，support_quality=false
business:
  shop:
    enabled: true
    give_command: 'spawn {{item}} {{count}}'
    quality_tiers: 0
    support_quality: false
  cdk:
    enabled: true
    redeem_command: 'spawn {{item}} {{count}}'
  chat_enhancement:
    welcome:
      enabled: true
      first_gift_command: 'spawn Wood 20'
    periodic_messages:
      enabled: true
      broadcast_command: 'say {{message}}'
    response_rules:
      enabled: false
  players:
    kick_command: 'kick {{player}}'
    ban_command: 'ban {{player}}'
  lists:
    banlist_add: 'ban {{player}}'
  verify:
    enabled: false

# ============================================================================
# Valheim 扩展字段
# ============================================================================

# ---- 多配置文件 ----
# Valheim 无主配置文件，通过启动参数配置；以下为管理员/封禁/许可名单文件（纯文本，一行一个 SteamID）
config_files:
  - name: adminlist
    path: '{{instance_root}}/adminlist.txt'
    format: ini
    group: ops
    schema: {}
    read_only: false
  - name: bannedlist
    path: '{{instance_root}}/bannedlist.txt'
    format: ini
    group: ops
    schema: {}
    read_only: false
  - name: permittedlist
    path: '{{instance_root}}/permittedlist.txt'
    format: ini
    group: ops
    schema: {}
    read_only: false

# ---- 存档管理 ----
saves:
  dir: '{{instance_root}}/saves/worlds_local'
  extension: '.db'
  create_command: 'save'
  activate_command: 'save'

# ---- 聊天日志解析 ----
chat_log:
  pattern: '^\[Chat\] ([^:]+): (.+)$'
  storage_enabled: true
  retention_days: 30

# ---- Mod 管理 ----
# Valheim Mod 主要通过 BepInEx 加载，dll 文件放在 BepInEx/plugins/
mods:
  list_file: '{{instance_root}}/BepInEx/plugins/mod-list.json'
  list_format: json
  dependency_check: false
  download_enabled: false
  download_source: 'https://valheim.thunderstore.io/'
  mechanism: file-presence
  file_extensions: ['.dll']
  mods_dir: 'BepInEx/plugins'

# ---- 启动前置引导（首次启动前向导，v4.x 新增）----
startup_guide:
  enabled: true
  steps:
    - key: world-setup
      title: 世界设置
      description: 设置世界名称与种子
      fields:
        - key: world_name
          type: world_name
          label: 世界名称
          description: 对应 -world 参数（存档名）
          required: true
          default: world
        - key: world_seed
          type: seed
          label: 世界种子
          description: Valheim 世界种子（仅首次创建世界时生效，留空随机）
          required: false
    - key: server-settings
      title: 服务器设置
      description: 服务器密码与最大玩家数
      fields:
        - key: server_password
          type: password
          label: 服务器密码
          description: 至少 5 字符
          required: true
        - key: max_players
          type: max_players
          label: 最大玩家数
          description: Valheim 默认上限 10 人
          required: false
          default: 10
          min: 1
          max: 64
  args_mapping:
    world_name: '{{world_name}}'
    server_password: '{{server_password}}'
