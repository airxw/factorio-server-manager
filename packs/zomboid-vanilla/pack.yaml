# ---- stdout 事件解析规则 ----
# Zomboid 日志格式（best-effort，实际格式可能随版本变化）
event_parsers:
  chat:
    pattern: '^Chat: \[([^]]+)\] (.+)$'
    groups: [player, message]
  join:
    pattern: '^Player connected: (\S+)'
    player_group: 1
  leave:
    pattern: '^Player disconnected: (\S+)'
    player_group: 1

# ---- 业务能力声明 ----
# PZ additem 命令模板不含品质参数，support_quality=false
business:
  shop:
    enabled: true
    give_command: 'additem "{{player}}" {{item}} {{count}}'
    quality_tiers: 0
    support_quality: false
  cdk:
    enabled: true
    redeem_command: 'additem "{{player}}" {{item}} {{count}}'
  chat_enhancement:
    welcome:
      enabled: true
      first_gift_command: 'additem "{{player}}" Base.Bandage 5'
    periodic_messages:
      enabled: true
      broadcast_command: 'servermsg {{message}}'
    response_rules:
      enabled: false
  players:
    kick_command: 'kickuser "{{player}}"'
    ban_command: 'banuser "{{player}}"'
  lists:
    whitelist_add: 'addusertowhitelist "{{player}}"'
    banlist_add: 'banuser "{{player}}"'
  verify:
    enabled: false

# ============================================================================
# Zomboid 扩展字段
# ============================================================================

# ---- 多配置文件 ----
# Zomboid 主配置 Zomboid/Server/<ServerName>.ini（含 MaxPlayers/Password/RCON/PVP 等字段）
config_files:
  - name: server-config
    path: '{{instance_root}}/Zomboid/Server/{{server_name}}.ini'
    format: ini
    group: server
    schema:
      MaxPlayers:
        type: integer
        description: 最大玩家数
      Password:
        type: string
        description: 服务器密码
      Open:
        type: boolean
        description: 是否开放加入（true=开放，false=需密码）
      Public:
        type: boolean
        description: 是否公开到服务器列表
      PublicName:
        type: string
        description: 公开服务器名称
      PublicDescription:
        type: string
        description: 服务器描述
      ServerWelcomeMessage:
        type: string
        description: 服务器欢迎信息
      RCONPort:
        type: integer
        description: RCON 端口
      RCONPassword:
        type: string
        description: RCON 密码
      RCONEnabled:
        type: boolean
        description: 是否启用 RCON
      PauseEmpty:
        type: boolean
        description: 无人时是否暂停
      PVP:
        type: boolean
        description: 是否开启 PVP
      ShowCoordinates:
        type: boolean
        description: 是否显示坐标
      ShowFirstAndLastName:
        type: boolean
        description: 是否显示玩家姓和名
    read_only: false

# ---- 存档管理 ----
# Zomboid 存档目录：Zomboid/Saves/Multiplayer/<ServerName>
saves:
  dir: '{{instance_root}}/Zomboid/Saves/Multiplayer/{{server_name}}'
  extension: '.bin'
  create_command: 'save'
  activate_command: 'save'

# ---- 聊天日志解析 ----
chat_log:
  pattern: '^Chat: \[([^]]+)\] (.+)$'
  storage_enabled: true
  retention_days: 30

# ---- Mod 管理 ----
# Zomboid Mod 放在 Zomboid/mods/ 目录，通过 Zomboid/Server/<servername>.ini 的 WorkshopItems= 启用
mods:
  list_file: '{{instance_root}}/Zomboid/Server/{{server_name}}_mods.txt'
  list_format: ini
  dependency_check: false
  download_enabled: false
  download_source: 'https://steamcommunity.com/workshop/browse?appid=108600'
  mechanism: workshop-id

# ---- 启动前置引导（首次启动前向导，v4.x 新增）----
startup_guide:
  enabled: true
  steps:
    - key: world-setup
      title: 世界设置
      description: 设置世界名称与种子（Zomboid 中世界名即服务器名，决定存档目录）
      fields:
        - key: world_name
          type: world_name
          label: 世界名称
          description: 存档目录名（与服务器名一致，决定 Zomboid/Saves/Multiplayer/ 下的目录）
          required: false
          default: Dedicated
        - key: world_seed
          type: seed
          label: 世界种子
          description: 留空则随机生成世界种子
          required: false
    - key: server-settings
      title: 服务器设置
      description: 服务器名称、最大玩家数与密码（写入 ServerName.ini）
      fields:
        - key: server_name
          type: server_name
          label: 服务器名称
          description: 决定启动参数 -servername 与配置文件名
          required: true
          default: 'Dedicated'
        - key: max_players
          type: config_ref
          label: 最大玩家数
          config_ref:
            file: server-config
            key: MaxPlayers
          required: true
          default: 16
          min: 1
          max: 64
        - key: server_password
          type: password
          label: 服务器密码
          description: 玩家加入密码（可留空）
          required: false
  args_mapping:
    server_name: '{{server_name}}'
  config_writes:
    - field_key: server_name
      file: server-config
      config_key: PublicName
    - field_key: max_players
      file: server-config
      config_key: MaxPlayers
    - field_key: server_password
      file: server-config
      config_key: Password
