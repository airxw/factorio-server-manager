# ============================================================================
# Project Zomboid Vanilla Pack — GameServer Panel 4.0.0
# 依据：public/schema/pack-schema.ts（必须通过 zod 校验）
# 协议：RCON（Project Zomboid 通过 RCON 协议管理，需在 ServerName.ini 中启用 RCON）
# Steam App ID: 380870（Project Zomboid Dedicated Server）
# 参考：https://pzwiki.net/wiki/Dedicated_Server
#       https://pzwiki.net/wiki/Server_Commands
# verified: 2026-07-24 https://projectzomboid.com/blog/
# ============================================================================

pack:
  id: zomboid-vanilla
  game: zomboid
  variant: vanilla
  display_name: 僵尸毁灭工程 (专用服务器)
  version: '1.0'

startup:
  # Linux 专用服务端启动脚本（Steam App ID: 380870）
  binary: './start-server.sh'
  args:
    - '-servername'
    - '{{server_name}}'
    - '-adminpassword'
    - '{{admin_password}}'
    - '-port'
    - '{{game_port}}'
    - '-udpport'
    - '{{game_port}}'
  working_dir: '{{instance_root}}'
  # Zomboid 就绪日志：服务器监听端口
  ready_pattern: 'Server is listening on port|Server started'
  stop_command: 'quit'
  stop_method: rcon
  stop_timeout: 60
  # Zomboid 默认游戏端口（UDP）
  default_game_port: 16261
  # 端口声明：游戏端口 + Steam 端口 + RCON 端口
  required_ports:
    - { port: 16261, protocol: udp, name: game,  primary: true }
    - { port: 16262, protocol: udp, name: steam, primary: false }
    - { port: 27015, protocol: tcp, name: rcon,  primary: false }
  failure_pattern: 'FATAL|Failed to start|Segmentation fault'

protocol:
  type: rcon
  # Zomboid RCON 默认端口（与 required_ports 中 rcon 一致）
  default_port: 27015
  auth: password
  encrypt: none
  config_key:
    file: 'Zomboid/Server/{{server_name}}.ini'
    enable_key: RCONEnabled
    port_key: RCONPort
    password_key: RCONPassword

commands:
  # PZ RCON 命令（servermsg 用于服务器公告；additem 用 module.item 格式物品 ID）
  broadcast: 'servermsg {{message}}'
  give_item: 'additem "{{player}}" {{item}} {{count}}'
  kick_player: 'kickuser "{{player}}"'
  ban_player: 'banuser "{{player}}"'
  unban_player: 'unbanuser "{{player}}"'
  list_players: 'players'
  save_world: 'save'

# ---- 版本源 ----
# Project Zomboid 服务端通过 SteamCMD 更新（App ID 380870）。
# provider=official-site 配合 official_url + version_regex 提取人类可读版本号；
# 失败时按 Steam 游戏多源回退链自动降级（official-site → github-release → steamcmd-buildid → static）。
# SteamCMD 实际下载由 daemon steam-install 流程接管（按 depot buildid 下载）。
versions:
  source: 'steamcmd://380870'
  type: steamcmd
  provider: official-site
  official_url: 'https://projectzomboid.com/blog/'
  # 从官方博客/公告页面提取 x.y 或 x.y.z 格式版本号；未匹配时走回退链（steamcmd-buildid 读取 appmanifest buildid）
  version_regex: '(\d+\.\d+(?:\.\d+)?)'
  steam_login: anonymous
  eula_required: false

# ---- 游戏更新 ----
# Project Zomboid 走 SteamCMD：current_version_command/install_command 省略（Steam 游戏读 appmanifest buildid，
# 由 daemon steam-install 流程接管下载+安装+校验）。source_url 仅作 URL 格式占位，
# 实际版本获取由 versions.provider 链处理（provider 存在时 updateService 不 fetch source_url）。
update:
  source_url: 'https://projectzomboid.com/blog/'
  download_dir: '{{instance_root}}'

backup:
  # Zomboid 存档目录：Zomboid/Saves/Multiplayer/<ServerName>
  world_dir: '{{instance_root}}/Zomboid/Saves/Multiplayer/{{server_name}}'
  # v4.2.0: save 命令已迁移至 backupService GAME_BACKUP_PROTOCOLS（通过 sendCommand 发送）
  pre_backup_commands: []
  post_backup_commands: []

ui:
  tabs:
    - { tab: console,      group: runtime,  order: 10, require_state: [stopped, starting, running, stopping, error] }
    - { tab: config-files, group: config,   order: 10, require_state: [stopped, starting, running, error] }
    - { tab: players,      group: runtime,  order: 40, require_state: [stopped, running, stopping, error] }
    - { tab: saves,        group: config,   order: 30, require_state: [stopped, error] }
    - { tab: mods,         group: config,   order: 40, require_state: [stopped, error] }
    - { tab: chat-logs,    group: runtime,  order: 30, require_state: [stopped, running, stopping, error] }
    - { tab: shop-admin,   group: business, order: 10, require_state: [stopped, starting, running, stopping, error] }
    - { tab: update,       group: config,   order: 50, require_state: [stopped, error] }

resources:
  min_ram: '4G'
  recommended_ram: '8G'
  min_disk: '5G'

