# ============================================================================
# Rust Vanilla Pack — GameServer Panel 3.0.0
# 依据：public/schema/pack-schema.ts（必须通过 zod 校验）
# 协议：WebRCON（Rust 原生 WebRCON 协议，HTTP+JSON）
# 参考：https://wiki.facepunch.com/rust/Server_Setup + https://umod.org/games/rust
# verified: 2026-07-24 https://wiki.facepunch.com/rust/ + https://umod.org/games/rust
# ============================================================================

pack:
  id: rust-vanilla
  game: rust
  variant: vanilla
  display_name: 腐蚀 (原版)
  version: '1.0'

startup:
  # Rust 服务端二进制（Steam App ID: 258550）
  binary: './RustDedicated'
  args:
    - '-batchmode'
    - '-nographics'
    - '+server.port {{game_port}}'
    - '+rcon.port {{rcon_port}}'
    - '+server.identity {{server_identity}}'
    - '+server.hostname "{{server_hostname}}"'
    - '+server.maxplayers {{max_players}}'
    - '+server.worldsize 4000'
    - '+server.seed {{server_seed}}'
    - '+server.level "Procedural Map"'
    - '+rcon.password "{{rcon_password}}"'
    - '+rcon.web 1'
  working_dir: '{{instance_root}}'
  # Rust 就绪日志：服务端启动完成
  ready_pattern: 'Server startup complete|Unloading 1 unused Assets'
  stop_command: 'quit'
  stop_timeout: 30
  stop_method: rcon
  # Rust 默认游戏端口（UDP，贴近实际游戏端口）
  default_game_port: 28015
  # Rust 端口声明：游戏端口（UDP）+ WebRCON 端口（TCP）
  required_ports:
    - { port: 28015, protocol: udp, name: game, primary: true }
    - { port: 28016, protocol: tcp, name: rcon, primary: false }

protocol:
  type: webrcon
  # Rust WebRCON 默认端口（与游戏端口不同段，避免冲突）
  default_port: 28016
  auth: password
  encrypt: none
  config_key:
    file: server/{{server_identity}}/ServerAuto.cfg
    enable_key: rcon.web
    port_key: rcon.port
    password_key: rcon.password

# Rust 不使用旧版 config 字段，用 config_files 代替
commands:
  broadcast: 'say {{message}}'
  # Rust give 命令：give <player> "item shortname" amount（物品用 shortname，带引号）
  give_item: 'give {{player}} "{{item}}" {{count}}'
  kick_player: 'kick {{player}}'
  ban_player: 'ban {{player}} {{reason}}'
  list_players: 'players'
  save_world: 'save'
  whitelist_add: 'moderate add {{player}}'

# ---- 版本源 ----
# Rust 服务端通过 SteamCMD 更新（App ID 258550）。
# provider=official-site 配合 official_url + version_regex 提取人类可读版本号；
# 失败时按 Steam 游戏多源回退链自动降级（official-site → github-release → steamcmd-buildid → static）。
# SteamCMD 实际下载由 daemon steam-install 流程接管（按 depot buildid 下载）。
versions:
  source: 'steamcmd://258550'
  type: steamcmd
  provider: official-site
  official_url: 'https://wiki.facepunch.com/rust/'
  # 从 wiki 页面提取 x.y.z 格式版本号；未匹配时走回退链（steamcmd-buildid 读取 appmanifest buildid）
  version_regex: '(\d+\.\d+\.\d+)'
  fallback_buildid: ''
  steam_login: anonymous
  eula_required: true

# ---- 游戏更新 ----
# Rust 走 SteamCMD：current_version_command/install_command 省略（Steam 游戏读 appmanifest buildid，
# 由 daemon steam-install 流程接管下载+安装+校验）。source_url 仅作 URL 格式占位，
# 实际版本获取由 versions.provider 链处理（provider 存在时 updateService 不 fetch source_url）。
update:
  source_url: 'https://wiki.facepunch.com/rust/'
  download_dir: '{{instance_root}}'

backup:
  world_dir: server/{{server_identity}}
  # v4.2.0: save 命令已迁移至 backupService GAME_BACKUP_PROTOCOLS（通过 sendCommand 发送）
  pre_backup_commands: []
  post_backup_commands: []

ui:
  tabs:
    # v3.7.0: 对象格式——group/order/require_state
    - { tab: console,      group: runtime,  order: 10, require_state: [stopped, starting, running, stopping, error] }
    - { tab: config-files, group: config,   order: 10, require_state: [stopped, starting, running, error] }
    - { tab: players,      group: runtime,  order: 40, require_state: [stopped, running, stopping, error] }
    - { tab: saves,        group: ops,      order: 10, require_state: [stopped, error] }
    - { tab: mods,         group: ops,      order: 20, require_state: [stopped, error] }
    - { tab: chat-logs,    group: runtime,  order: 30, require_state: [stopped, running, stopping, error] }
    - { tab: shop-admin,   group: business, order: 10, require_state: [stopped, starting, running, stopping, error] }
    - { tab: update,       group: ops,      order: 30, require_state: [stopped, error] }

resources:
  min_ram: '4G'
  recommended_ram: '8G'
  min_disk: '10G'

