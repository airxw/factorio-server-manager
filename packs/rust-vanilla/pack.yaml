# ---- stdout 事件解析规则 ----
event_parsers:
  chat:
    pattern: '^\[CHAT\] ([^:]+): (.+)$'
    groups: [player, message]
  join:
    pattern: '^([^ ]+) joined the game$'
    player_group: 1
  leave:
    pattern: '^([^ ]+) left the game$'
    player_group: 1

# ---- 业务能力声明 ----
business:
  shop:
    enabled: true
    give_command: 'give {{player}} "{{item}}" {{count}}'
    quality_tiers: 0
    support_quality: false
  cdk:
    enabled: true
    redeem_command: 'give {{player}} "{{item}}" {{count}}'
  chat_enhancement:
    welcome:
      enabled: true
      first_gift_command: 'give {{player}} "wood" 100'
    periodic_messages:
      enabled: true
      broadcast_command: 'say {{message}}'
    response_rules:
      enabled: false
  players:
    kick_command: 'kick {{player}}'
    ban_command: 'ban {{player}} {{reason}}'
  lists:
    whitelist_add: 'moderate add {{player}}'
    banlist_add: 'ban {{player}} {{reason}}'
  verify:
    enabled: true

# ============================================================================
# Rust 扩展字段（Factorio 集成扩展字段，全部 optional）
# ============================================================================

# ---- 多配置文件 ----
# Rust 主配置通过启动参数传递，ServerAuto.cfg 为辅助配置
config_files:
  - name: server-auto-cfg
    path: '{{instance_root}}/server/{{server_identity}}/ServerAuto.cfg'
    format: ini
    group: server
    schema:
      server.hostname:
        type: string
        description: 服务器名称
      server.description:
        type: string
        description: 服务器描述
      server.maxplayers:
        type: integer
        description: 最大玩家数
      server.worldsize:
        type: integer
        description: 世界大小
      server.seed:
        type: integer
        description: 世界种子
      server.level:
        type: string
        description: 地图类型
      server.identity:
        type: string
        description: 服务端身份标识
      rcon.port:
        type: integer
        description: RCON 端口
      rcon.password:
        type: string
        description: RCON 密码
      rcon.web:
        type: integer
        description: 启用 WebRCON（0/1）
    read_only: false

# ---- 存档管理 ----
# Rust 存档目录：server/<identity>/，存档文件扩展名 .sav
saves:
  dir: '{{instance_root}}/server/{{server_identity}}'
  extension: '.sav'
  create_command: 'save'
  activate_command: 'save'

# ---- 聊天日志解析 ----
chat_log:
  pattern: '^\[CHAT\] ([^:]+): (.+)$'
  storage_enabled: true
  retention_days: 30

# ---- Mod 管理 ----
# Rust 通过 uMod / Oxide 加载 mod，位于 oxide/plugins/
mods:
  list_file: '{{instance_root}}/oxide/plugins/mod-list.json'
  list_format: json
  dependency_check: false              # uMod mod 无标准依赖声明
  download_enabled: false
  download_source: 'https://umod.org/plugins/'
  mechanism: file-presence
  file_extensions: ['.cs']
  mods_dir: 'oxide/plugins'

# ---- 启动前置引导（首次启动前向导，v4.x 新增）----
startup_guide:
  enabled: true
  steps:
    - key: world-setup
      title: 世界设置
      description: 设置世界种子（决定地图生成）
      fields:
        - key: seed
          type: seed
          label: 世界种子
          description: 数字种子，决定世界地图生成
          required: true
          default: 1234
          min: 1
          max: 2147483647
    - key: server-settings
      title: 服务器设置
      description: 服务器名称、最大玩家数与描述
      fields:
        - key: server_name
          type: server_name
          label: 服务器名称
          description: 显示在服务器列表的名称
          required: true
          default: 'Rust Server'
        - key: max_players
          type: max_players
          label: 最大玩家数
          required: true
          default: 100
          min: 1
          max: 500
        - key: description
          type: config_ref
          label: 服务器描述
          config_ref:
            file: server-auto-cfg
            key: server.description
          required: false
  args_mapping:
    seed: '{{server_seed}}'
    server_name: '{{server_hostname}}'
    max_players: '{{max_players}}'
  config_writes:
    - field_key: description
      file: server-auto-cfg
      config_key: server.description
