# ============================================================================
# Terraria Vanilla Pack — GameServer Panel 4.0.0
# 依据：public/schema/pack-schema.ts（必须通过 zod 校验）
# 协议：stdin（Terraria 原版服务器无 RCON，通过标准输入发送命令）
# 参考：https://terraria.wiki.gg/wiki/Server + https://terraria.wiki.gg/wiki/Item_IDs
# verified: 2026-07-24 https://terraria.wiki.gg/ (Steam App ID 105600)
#
# 重要说明:
#   - 原版 Terraria 服务端无 give 命令(仅 TShock 支持 /give)
#   - shop/cdk/welcome 设为 disabled(对齐 palworld 范式)
#   - 版本号格式为 1.4.4.x(非 v5.2.0)
# ============================================================================

pack:
  id: terraria-vanilla
  game: terraria
  variant: vanilla
  display_name: 泰拉瑞亚 (原版)
  version: '1.0'

startup:
  # v4.1.0: SteamCMD 下载后的二进制位于 Linux/TerrariaServer.bin.x86_64
  # Steam App ID: 105600
  binary: './Linux/TerrariaServer.bin.x86_64'
  args:
    - '-config'
    - 'serverconfig.txt'
    - '-port'
    - '{{game_port}}'
    - '-players'
    - '{{max_players}}'
    - '-pass'
    - '{{server_password}}'
  working_dir: '{{instance_root}}'
  # Terraria 就绪日志：服务器启动完成
  ready_pattern: 'Listening on port|Server started'
  stop_command: 'exit'
  stop_timeout: 15
  # Terraria 默认游戏端口
  default_game_port: 7777
  # v4.12.0 步骤8: 端口声明
  required_ports:
    - { port: 7777, protocol: tcp, name: game, primary: true }
  # v4.12.0 步骤9: 停止方法
  stop_method: stdin
  failure_pattern: 'FATAL|Crash|Exception'

protocol:
  type: stdin
  default_port: 0
  auth: none
  encrypt: none

# v4.39.3: Terraria 原版服务端无 give 命令(仅 TShock 支持 /give)，give_item 留空占位
commands:
  broadcast: 'say {{message}}'
  kick_player: 'kick {{player}}'
  ban_player: 'ban {{player}}'
  unban_player: 'unban {{player}}'
  list_players: 'playing'
  save_world: 'save'
  # Terraria 原版无 give 命令 — give_item 留空占位，business.shop.enabled=false
  give_item: ''

versions:
  # v4.12.0 步骤1/3: 版本源改为 steamcmd:// 协议 + official-site provider
  source: 'steamcmd://105600'
  type: steamcmd
  eula_required: false
  provider: official-site
  official_url: 'https://terraria.org/'
  version_regex: '(\d+\.\d+\.\d+)'
  fallback_buildid: ''
  steam_login: anonymous

# ---- 游戏更新 ----
# v4.12.0 步骤3: Steam 游戏走 steam-install 流程,不需要 install_command/current_version_command
update:
  source_url: 'https://terraria.org/'
  download_dir: '{{instance_root}}'

backup:
  # Terraria 世界存档目录（建议通过 -worldpath 指定到实例目录）
  world_dir: '{{instance_root}}/Worlds'
  # v4.2.0: save 命令已迁移至 backupService GAME_BACKUP_PROTOCOLS（通过 sendCommand 发送）
  pre_backup_commands: []
  post_backup_commands: []

ui:
  tabs:
    - { tab: console,      group: runtime,  order: 10, require_state: [stopped, starting, running, stopping, error] }
    - { tab: config-files, group: config,   order: 10, require_state: [stopped, starting, running, error] }
    - { tab: players,      group: runtime,  order: 40, require_state: [stopped, running, stopping, error] }
    - { tab: saves,        group: config,   order: 30, require_state: [stopped, error] }
    - { tab: mods,         group: config,   order: 40, require_state: [stopped, error] }
    - { tab: chat-logs,    group: runtime,  order: 30, require_state: [stopped, running, stopping, error] }
    # v4.39.3: shop-admin 移除(原版无 give 命令)
    - { tab: update,       group: config,   order: 50, require_state: [stopped, error] }

resources:
  min_ram: '512M'
  recommended_ram: '1G'
  min_disk: '500M'

# ============================================================================
# 扩展字段（pack-schema-extension.json）
# Terraria 原版无品质概念：qualities=[], quality_tiers=0
# ============================================================================

