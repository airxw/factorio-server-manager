# ---- stdout 事件解析规则 ----
event_parsers:
  chat:
    pattern: '^<([^>]+)> (.+)$'
    groups: [player, message]
  join:
    pattern: '^([^ ]+) has joined\.$'
    player_group: 1
  leave:
    pattern: '^([^ ]+) has left\.$'
    player_group: 1

# ---- 业务能力声明 ----
# v4.39.3: 原版 Terraria 服务端无 give 命令，shop/cdk/welcome 设为 disabled
business:
  shop:
    enabled: false                 # 原版无 give 命令
    quality_tiers: 0
    support_quality: false
  cdk:
    enabled: false                 # 原版无 give 命令，CDK 兑换无意义
  chat_enhancement:
    welcome:
      enabled: false               # 无法发放欢迎礼物
    periodic_messages:
      enabled: true
      broadcast_command: 'say {{message}}'
    response_rules:
      enabled: false
  players:
    kick_command: 'kick {{player}}'
    ban_command: 'ban {{player}}'
  lists:
    banlist_add: 'ban {{player}}'
  verify:
    enabled: false

# ============================================================================
# Terraria 扩展字段
# ============================================================================

# ---- 多配置文件 ----
config_files:
  - name: server-config
    path: '{{instance_root}}/serverconfig.txt'
    format: ini
    group: server
    schema:
      maxplayers:
        type: integer
        description: 最大玩家数
      port:
        type: integer
        description: 服务器端口
      password:
        type: string
        description: 服务器密码
      motd:
        type: string
        description: 每日消息
      worldpath:
        type: string
        description: 世界文件路径
      worldname:
        type: string
        description: 世界名称
      seed:
        type: string
        description: 世界种子
      difficulty:
        type: string
        description: 游戏难度
    read_only: false
  - name: ban-list
    path: '{{instance_root}}/banlist.txt'
    format: ini
    group: ops
    schema: {}
    read_only: false

# ---- 存档管理 ----
saves:
  dir: '{{instance_root}}/Worlds'
  extension: '.wld'
  create_command: 'save'
  activate_command: 'save'

# ---- 聊天日志解析 ----
chat_log:
  pattern: '^<([^>]+)> (.+)$'
  storage_enabled: true
  retention_days: 30

# ---- Mod 管理 ----
# Terraria tModLoader 版 Mod 放在 Mods/ 目录
mods:
  list_file: '{{instance_root}}/Mods/enabled.json'
  list_format: json
  dependency_check: false
  download_enabled: false
  download_source: 'https://forums.terraria.org/index.php?forums%2Fworkshop.205/'
  mechanism: list-file
  file_extensions: ['.tmod']
  mods_dir: 'Mods'

# ---- 启动前置引导（首次启动前向导，v4.x 新增）----
startup_guide:
  enabled: true
  steps:
    - key: world-setup
      title: 世界设置
      description: 设置世界名称、种子与难度（写入 serverconfig.txt）
      fields:
        - key: world_name
          type: world_name
          label: 世界名称
          description: 对应 serverconfig.txt 的 worldname
          required: true
          default: world
        - key: world_seed
          type: seed
          label: 世界种子
          description: 留空则随机生成
          required: false
        - key: difficulty
          type: difficulty
          label: 游戏难度
          description: 对应 serverconfig.txt 的 difficulty
          required: true
          default: normal
          enum_values: [normal, expert, master, journey]
    - key: server-settings
      title: 服务器设置
      description: 最大玩家数与服务器密码
      fields:
        - key: max_players
          type: config_ref
          label: 最大玩家数
          config_ref:
            file: server-config
            key: maxplayers
          required: true
          default: 16
          min: 1
          max: 255
        - key: server_password
          type: password
          label: 服务器密码
          description: 留空则无密码
          required: false
  args_mapping:
    max_players: '{{max_players}}'
    server_password: '{{server_password}}'
  config_writes:
    - field_key: world_name
      file: server-config
      config_key: worldname
    - field_key: world_seed
      file: server-config
      config_key: seed
    - field_key: difficulty
      file: server-config
      config_key: difficulty
    - field_key: max_players
      file: server-config
      config_key: maxplayers
    - field_key: server_password
      file: server-config
      config_key: password
