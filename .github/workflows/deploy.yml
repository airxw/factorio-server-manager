# ============================================================================
# CD 自动部署 — push tag v*.*.* 时触发
# L6: 三项目 build → SSH 部署 → 健康检查 → 失败自动回滚
# ============================================================================
#
# 兼容性说明（Gitea Actions）：
#   本文件使用标准 GitHub Actions 语法。Gitea Actions runner（act_runner）
#   对 actions/checkout@v4 / actions/setup-node@v4 / actions/upload-artifact@v4
#   均已兼容；appleboy/ssh-action 同样可用。
#   若 Gitea runner 内置 Node 工具链不可用，setup-node 会自动从 NodeSource 下载。
#
# 必需 Secrets：
#   DEPLOY_SSH_KEY  — 部署服务器 SSH 私钥（PEM 格式，对应 DEPLOY_USER 的公钥）
#   DEPLOY_HOST     — 部署服务器主机（如 gsp.ecsrz.com 或 192.168.5.14）
#   DEPLOY_USER     — SSH 登录用户（需具备 sudo 权限以执行 deploy.sh）
#
# 触发条件：
#   push tag v*.*.*（如 v4.8.0、v5.0.1）
#   注意：tag 必须以 v 开头，后跟 x.y.z 数字版本号

name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

  # 允许手动触发（用于测试或紧急部署）
  workflow_dispatch:
    inputs:
      ref:
        description: '部署的分支/tag/commit（默认当前 tag）'
        required: false
        default: ''

# 同一 tag 重复 push 时取消旧 run
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 三项目并行 build：产物供部署步骤使用，同时验证构建可用性
  # -------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-daemon:
    name: Build Daemon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: daemon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # -------------------------------------------------------------------------
  # 版本号同步校验：部署前确认所有版本号一致，避免发布错版本
  # -------------------------------------------------------------------------
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Run version sync check
        run: npx tsx scripts/check-version-sync.ts

  # -------------------------------------------------------------------------
  # 部署：三个 build + 版本号校验全部通过后，SSH 到服务器执行 deploy.sh update
  # 失败时自动调用 deploy.sh update --rollback 回滚到上一备份
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-daemon, version-sync]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/airxw/Documents/gsp/gameserver-panel
            echo "[1/3] 拉取最新代码..."
            git fetch --tags
            git checkout ${{ github.ref_name }}
            echo "[2/3] 执行 deploy.sh update..."
            sudo bash deploy.sh update
            echo "[3/3] 部署完成"

      - name: Health check
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # 健康检查：检测 Panel（3002 内部端口）+ Daemon（8080）
            # 注意：仅本机检测，不通过浏览器端口（3000/3001 由 nginx 接管）
            PANEL_HEALTH="http://localhost:3002/api/health"
            DAEMON_HEALTH="http://localhost:8080/health"
            panel_ok=false
            daemon_ok=false
            for i in $(seq 1 30); do
              if [[ "$panel_ok" == "false" ]] && curl -sf --max-time 3 "$PANEL_HEALTH" >/dev/null 2>&1; then
                panel_ok=true
                echo "Panel healthy"
              fi
              if [[ "$daemon_ok" == "false" ]] && curl -sf --max-time 3 "$DAEMON_HEALTH" >/dev/null 2>&1; then
                daemon_ok=true
                echo "Daemon healthy"
              fi
              if [[ "$panel_ok" == "true" && "$daemon_ok" == "true" ]]; then
                echo "ALL HEALTHY"
                exit 0
              fi
              sleep 2
            done
            echo "HEALTH CHECK FAILED: panel=$panel_ok daemon=$daemon_ok"
            exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "部署失败，执行自动回滚..."
            cd /home/airxw/Documents/gsp/gameserver-panel
            # --rollback 子命令内部会要求 yes/no 确认，此处通过 echo 自动确认
            echo "yes" | sudo bash deploy.sh update --rollback
            echo "回滚完成，请人工核查服务状态"
